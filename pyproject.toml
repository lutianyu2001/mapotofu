[project]
name = "mapotofu"
version = "0.1.0"
description = "Build CJK composite fonts (CFF2 variable and static CFF, hinted) from a TOML description"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "afdko>=5.0.1",
    "brotli>=1.2.1",
    "cffsubr>=0.4.0",
    "fonttools[lxml,unicode]>=4.68.0",
]

[project.scripts]
mapotofu = "mapotofu.build:main"
mapo = "mapotofu.build:main"

[dependency-groups]
dev = [
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "uharfbuzz>=0.57.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapotofu"]
